[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "J.A.R.V.I.S. local desktop assistant"
authors = ["Lorran1690"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
